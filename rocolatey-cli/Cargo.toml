[package]
license = "MIT"
name = "roco"
version = "0.9.5"
authors = ["Manfred Wallner <schusterfredl@mwallner.net>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rocolatey-lib = { path = "../rocolatey-lib" }

tokio = { version = "1.38.2", features = ["full"] }
clap = "4.4.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# owo-colors chosen over `colored`: zero dependencies, type-system Display
# wrappers (no per-call heap alloc), and TTY detection via std::io::IsTerminal.
owo-colors = "4"
anstream = "0.6"

[build-dependencies]
clap = "4.4.14"
clap_complete = "4.4.6"
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
rcgen = "0.12"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
time = "0.3"
