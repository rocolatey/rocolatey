[package]
license = "MIT"
name = "rocolatey-lib"
version = "0.9.5"
authors = ["Manfred Wallner <schusterfredl@mwallner.net>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
quick-xml = "0.31.0"
glob = "0.3.1"
futures = "0.3.30"
reqwest = "0.11.23"
semver = "1.0.21"
regex = "1.10.2"
walkdir = "2.4.0"
http-auth-basic = "0.3.3"
tokio = { version = "1.38.2", features = ["full"] }
serde_with = "3.4.0"
serde = "1.0.195"
num_cpus = "1.16.0"
zip = "0.6"
serde_json = { version = "1.0.149", default-features = false, features = [
  "alloc",
] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
